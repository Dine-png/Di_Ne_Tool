name: Build Repo Listing

on:
  release:
    types: [published, created, edited, deleted]
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-listing.yml
      - Packages/com.dinetool.avatar-tools/package.json
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build index.json
        run: |
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT

          pkg_name=$(jq -r '.name' Packages/com.dinetool.avatar-tools/package.json)
          pkg_display=$(jq -r '.displayName' Packages/com.dinetool.avatar-tools/package.json)
          pkg_version=$(jq -r '.version' Packages/com.dinetool.avatar-tools/package.json)
          zip_url="https://github.com/${{ github.repository }}/releases/download/${pkg_version}/${pkg_name}-${pkg_version}.zip"
          listing_id="com.dinetool.listing"
          listing_url="https://dine-png.github.io/Di_Ne_Tool/index.json"

          pkg=$(jq --arg url "$zip_url" '.url = $url' Packages/com.dinetool.avatar-tools/package.json)

          # Keep every previously published version. VPM projects can remain locked
          # to old versions, so dropping them from the listing breaks restores.
          if ! curl --fail --silent --show-error --location "$listing_url" -o "$build_dir/current.json"; then
            echo '{}' > "$build_dir/current.json"
          fi

          jq -s \
            --arg name "$pkg_display" \
            --arg author "Dine" \
            --arg id "$listing_id" \
            --arg url "$listing_url" \
            --arg pkg_name "$pkg_name" \
            --arg version "$pkg_version" \
            --argjson pkg "$pkg" \
            '((.[0].packages[$pkg_name].versions // {}) *
              (.[1].packages[$pkg_name].versions // {}) *
              {($version): $pkg}) as $versions |
             {name: $name, id: $id, url: $url, author: $author,
              packages: {($pkg_name): {versions: $versions}}}' \
            index.json "$build_dir/current.json" \
            > "$build_dir/index.json"

          mv "$build_dir/index.json" index.json
          cat index.json

      - name: Update canonical listing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "Listing is already up to date"
            exit 0
          fi
          git commit -m "Update VPM package listing"
          git push origin HEAD:main
